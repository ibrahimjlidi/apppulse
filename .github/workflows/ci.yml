name: AppPulse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-publish:
    name: Build, test, scan, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      MYSQL_DATABASE: apppulse_ci
      MYSQL_USER: apppulse_ci
      MYSQL_PASSWORD: apppulse_ci_password
      MYSQL_ROOT_PASSWORD: apppulse_ci_root_password
      MYSQL_HOST_PORT: 3307
      HTTP_PORT: 8081
      PMA_ABSOLUTE_URI: http://localhost:8081/phpmyadmin/
      API_BASE_URL: http://localhost:8081
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/apppulse-api:latest
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/apppulse-frontend:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build API
        run: |
          npm run typecheck
          npm run build

      - name: Build API and frontend images once
        run: docker compose build api frontend

      - name: Scan API image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.API_IMAGE }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          timeout: 10m

      - name: Scan frontend image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.FRONTEND_IMAGE }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          timeout: 10m

      - name: Start stack from the scanned images
        run: docker compose up -d --no-build

      - name: Wait for API and database
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent "$API_BASE_URL/health"; then
              echo
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs --tail=100 api mysql nginx
          exit 1

      - name: Run API integration test
        run: npm run test:integration

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish the scanned images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          docker tag "$API_IMAGE" "ghcr.io/${GITHUB_REPOSITORY_OWNER}/apppulse-api:$GHCR_SHA"
          docker tag "$FRONTEND_IMAGE" "ghcr.io/${GITHUB_REPOSITORY_OWNER}/apppulse-frontend:$GHCR_SHA"

          docker push "$API_IMAGE"
          docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/apppulse-api:$GHCR_SHA"
          docker push "$FRONTEND_IMAGE"
          docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/apppulse-frontend:$GHCR_SHA"

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
