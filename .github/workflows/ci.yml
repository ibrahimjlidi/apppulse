name: AppPulse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and integration test
    runs-on: ubuntu-latest
    env:
      MYSQL_DATABASE: apppulse_ci
      MYSQL_USER: apppulse_ci
      MYSQL_PASSWORD: apppulse_ci_password
      MYSQL_ROOT_PASSWORD: apppulse_ci_root_password
      MYSQL_HOST_PORT: 3307
      HTTP_PORT: 8081
      PMA_ABSOLUTE_URI: http://localhost:8081/phpmyadmin/
      API_BASE_URL: http://localhost:8081

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build API
        run: |
          npm run typecheck
          npm run build

      - name: Start Docker Compose stack
        run: docker compose up -d --build

      - name: Wait for API and database
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent "$API_BASE_URL/health"; then
              echo
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs --tail=100 api mysql nginx
          exit 1

      - name: Run API integration test
        run: npm run test:integration

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
