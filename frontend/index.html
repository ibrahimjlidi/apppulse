<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta
      name="description"
      content="AppPulse, un tableau de bord simple pour suivre vos tâches."
    />
    <title>AppPulse — Tableau de bord</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="AppPulse, accueil">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span>AppPulse</span>
      </a>
      <div class="api-status">
        <span id="health-dot" class="health-dot" aria-hidden="true"></span>
        <span id="health-label">Connexion…</span>
      </div>
    </header>

    <main class="layout">
      <section class="intro">
        <p class="eyebrow">ESPACE DE TRAVAIL</p>
        <h1>Vos tâches, en un coup d’œil.</h1>
        <p class="intro-copy">
          Organisez votre travail et suivez votre progression simplement.
        </p>
      </section>

      <section class="summary" aria-label="Résumé des tâches">
        <article class="summary-card">
          <span class="summary-label">Total</span>
          <strong id="total-count">—</strong>
        </article>
        <article class="summary-card">
          <span class="summary-label">À faire</span>
          <strong id="pending-count">—</strong>
        </article>
        <article class="summary-card">
          <span class="summary-label">Terminées</span>
          <strong id="completed-count">—</strong>
        </article>
      </section>

      <section class="content-grid">
        <section class="panel task-panel" aria-labelledby="tasks-heading">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">SUIVI</p>
              <h2 id="tasks-heading">Liste des tâches</h2>
            </div>
            <button id="refresh-button" class="button button-quiet" type="button">
              Actualiser
            </button>
          </div>
          <p id="notice" class="notice" role="status" aria-live="polite"></p>
          <div id="task-list" class="task-list" aria-live="polite"></div>
        </section>

        <section class="panel form-panel" aria-labelledby="form-heading">
          <p class="eyebrow">ORGANISATION</p>
          <h2 id="form-heading">Nouvelle tâche</h2>
          <form id="task-form">
            <label for="task-title">Titre</label>
            <input
              id="task-title"
              name="title"
              type="text"
              maxlength="200"
              placeholder="Ex. Préparer la prochaine livraison"
              required
            />

            <label for="task-description">Description <span>(facultative)</span></label>
            <textarea
              id="task-description"
              name="description"
              rows="4"
              maxlength="10000"
              placeholder="Ajoutez quelques détails…"
            ></textarea>

            <div class="form-actions">
              <button id="cancel-edit" class="button button-quiet hidden" type="button">
                Annuler
              </button>
              <button id="submit-button" class="button button-primary" type="submit">
                Ajouter la tâche
              </button>
            </div>
          </form>
        </section>
      </section>

      <footer>
        AppPulse <span aria-hidden="true">·</span> API Express et base de données MySQL
      </footer>
    </main>
  </body>
</html>
